# ╔══════════════════════════════════════════════════════════════════════╗
# ║                     ShardBuyer — exclusive items                     ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Special items with a boosted price that can only be sold a limited number of times.
# Limits reset every reset-interval. With rotation enabled, a new random set of items
# is picked from the list each time.
# The menu is configured in lang/<code>/menus.yml -> exclusive-menu. Open it: /buyer exclusive

enabled: true
# How often limits (and the item set) refresh: 30m, 6h, 1d, 1d12h ...
reset-interval: 12h
# PLAYER — every player has their own limit, GLOBAL — one shared limit for the whole server
limit-mode: PLAYER
# Apply the level bonus to exclusive items (permission multipliers and the booster always apply)
apply-level-boost: true
# Give leveling points (to the category the item belongs to)
give-points: true
# Announce the refresh in chat
announce-reset: true

rotation:
  # true — "amount" random items are picked from the list (using weight)
  # false — all listed items are available
  enabled: true
  amount: 5

# material — item; price — price per item; points — points per item;
# limit — how many can be sold per period; weight — chance to be picked for the rotation
items:
  diamond:
    material: DIAMOND
    price: 120
    points: 150
    limit: 32
    weight: 3
