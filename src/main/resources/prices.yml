# ╔══════════════════════════════════════════════════════════════════════╗
# ║                         ShardBuyer — prices                          ║
# ╚══════════════════════════════════════════════════════════════════════╝
# Only BASE prices per 1 item are set here (mostly raw resources). The prices of everything
# else are calculated by the plugin from the server's recipes:
#
#   • Packing — 9 dried kelp <-> dried kelp block. This is not crafting but "packing":
#     the block costs exactly as much as 9 dried kelp (packing-multiplier = 1.0).
#     Packing is detected automatically: a recipe exists in both directions.
#   • Crafting — e.g. a piston: (planks + cobblestone + iron + redstone) * craft-multiplier.
#     So crafting and selling a piston pays more than selling the resources separately.
#   • Smelting — kelp 2$ -> dried kelp 2 * 1.5 = 3$.
#   • Stonecutter and smithing table have their own multipliers.
#   • If an item can be made by several recipes, the cheapest one is used (anti-exploit).
#
# Prices set manually below are NEVER overwritten by auto-pricing.
# Change any price: just add the item here (or use /shardbuyer setprice <price> in game).
# Price 0 — the item cannot be sold (and is not auto-priced).
# See ALL final prices: /shardbuyer dump -> computed-prices.yml
#
# Format:
#   DIAMOND: 50                       — price
#   DIAMOND: {price: 50, points: 80}  — price and custom leveling points per item
#                                      (otherwise points = price * leveling.points-per-money)

auto-calculation:
  enabled: true
  craft-multiplier: 1.15
  packing-multiplier: 1.0
  smelting-multiplier: 1.5
  stonecutting-multiplier: 1.0
  smithing-multiplier: 1.1
  # decimal places of calculated prices
  round-decimals: 2
  max-iterations: 60
  # also use recipes added by other plugins (default: vanilla only)
  include-plugin-recipes: false
  # these items are never auto-priced (only if set manually)
  exclude: []
  # these items are never used as ingredients when calculating
  ignore-ingredients: []

# Items that can never be sold
disabled:
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - SPAWNER
  - WRITTEN_BOOK
  - FILLED_MAP

