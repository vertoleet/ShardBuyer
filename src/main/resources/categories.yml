# ╔══════════════════════════════════════════════════════════════════════╗
# ║                        ShardBuyer — categories                       ║
# ╚══════════════════════════════════════════════════════════════════════╝
# The category id (key) is used in commands: /buyer ores, /worth ores
# Category NAMES and DESCRIPTIONS are translated in lang/<code>/menus.yml -> categories.
#
#   enabled: true/false      — turn the category on/off
#   slot                     — icon slot in the main menu (menu-mode: CATEGORIES)
#   icon                     — icon: material, glow, custom-model-data
#                              (name/lore can be set here too, otherwise lang/<code>/menus.yml -> category-icon is used)
#   name / description       — optional: override the translated name/description
#   leveling: true/false     — does the category give points and use the level bonus
#   permission: "perm.node"  — permission required to open the category (optional)
#   sort: CONFIG / PRICE_DESC / PRICE_ASC / NAME — item order
#   items                    — exact ids (DIAMOND), patterns (*_LOG, RAW_*) and "*" —
#                              every other priced item that is not in another category.
#                              Exact ids win over patterns. Only items with a price are shown.
#   menu                     — this category's own menu (menu-mode: CATEGORIES). You can set only
#                              some keys (title, size, item-slots, layout, item-format);
#                              the rest comes from lang/<code>/menus.yml -> category-menus / category-menu
#   levels                   — own levels for this category (only with leveling.mode: PER_CATEGORY),
#                              same format as config.yml -> leveling (type, levels, formula)

