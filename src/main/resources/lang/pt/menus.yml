# ─────────────────── Paged menu (menu-mode: PAGED) ───────────────────
# One menu, pages go through the categories. A big category takes several pages.
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {category_page}
#   {category_pages} {prev_category} {next_category}; flags: has_prev, has_next
paged-menu:
  title: "&8{category_plain} &8[{page}/{pages}]"
  size: 54
  item-slots: "9-44"
  # Category tabs on top (they scroll if there are more categories than slots)
  category-tabs:
    enabled: true
    slots: "0-8"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Página anterior"
      lore:
        - "&8» &7{prev_category}"
      action: PREV_PAGE
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPreços na descrição: {lore_status}"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fVenda automática: {autosell_status}"
      lore:
        - "&8▸ &7Itens escolhidos: &f{autosell_count}"
      action: TOGGLE_AUTOSELL
    sell-menu:
      slot: 48
      material: CHEST
      name: "&#4ADE80Menu de venda"
      action: OPEN_SELL
    info:
      slot: 49
      material: AMETHYST_SHARD
      glow: true
      name: "{category_name}"
      lore:
        - "&8▸ &7Página da categoria: &f{category_page}/{category_pages}"
        - "&8▸ &7Saldo: &#4ADE80${balance}"
        - ""
        - "[leveling]&8▸ &7Nível: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[!leveling]&8▸ &7Sem níveis aqui"
        - "[booster]&8▸ &#FBBF24Booster: &f{booster} &7({booster_time})"
    worth:
      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lLista de preços"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCExclusivos &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lVender a categoria inteira"
      lore:
        - "&#67E8F9Shift+Clique &8» &7vender"
      require-shift: true
      action: SELL_CATEGORY
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Próxima página »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Coloque aqui os itens para vender"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lVENDER POR ${total}"
    lore:
      - "&8▸ &7Itens: &f{amount} &8({positions} tipos)"
      - "[has_points]&8▸ &7Pontos de nível: &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171Não vendáveis: {unsellable} &8(serão devolvidos)"
      - ""
      - "&7Ou simplesmente feche o menu."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Coloque itens"
      lore:
        - "&8Arraste para cá itens do seu inventário"
        - "&8e feche o menu ou clique neste botão."
        - "[has_unsellable]&#F87171Estes itens não podem ser vendidos: {unsellable}"

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Lista de preços &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&fmais caros primeiro"
    PRICE_ASC: "&fmais baratos primeiro"
    NAME: "&fpor nome"
    CATEGORY: "&fpor categoria"
  filter-all-name: "&ftodas as categorias"
  search-none: "&8nenhuma"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Preço: &#4ADE80$&f{price}"
      - "&8▸ &7Pack &8(×{stack})&7: &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Mercado: &#F87171-{market_drop}%"
      - "&8▸ &7Categoria: &f{category_name}"
      - "[auto]&8Preço calculado pela receita de crafting"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Preço do livro por nível:"
      - "{levels}"
      - ""
      - "&8Encantamentos em armaduras e"
      - "&8ferramentas também aumentam o preço."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Página anterior"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Página &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Encontrados: &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fOrdenar: {sort}"
      lore:
        - "&#67E8F9Botão esq. &8» &7próximo"
        - "&#67E8F9Botão dir. &8» &7anterior"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fCategoria: {filter}"
      lore:
        - "&#67E8F9Botão esq. &8» &7próximo"
