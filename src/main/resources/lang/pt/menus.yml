# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Comprador"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Saldo: &#4ADE80${balance}"
        - "&8▸ &7Total ganho: &#4ADE80${earned}"
        - "&8▸ &7Itens vendidos: &f{sold}"
        - ""
        - "[leveling]&8▸ &7Nível: &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Bônus de preço: &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7Para o nível {next_level}: &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Próximo bônus: &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ Nível máximo alcançado!"
        - "[!leveling]&8▸ &7Níveis: &f{level_mode}"
        - "[perm_boost]&8▸ &7Bônus de cargo: &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Booster do servidor: &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lBOOSTER {booster}"
      lore:
        - "&7Todos os preços estão multiplicados!"
        - "&8▸ &7Tempo restante: &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lMenu de venda"
      lore:
        - "&7Coloque qualquer item e feche o menu —"
        - "&7tudo será vendido automaticamente."
        - "&7Itens encantados, livros e shulkers também!"
        - ""
        - "&#67E8F9» Clique para abrir"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lItens exclusivos"
      lore:
        - "&7Itens especiais com preços melhores."
        - "&7Só dá para vender uma quantidade limitada!"
        - ""
        - "&8▸ &7Renova em: &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Clique para abrir"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lLista de preços"
      lore:
        - "&7Todos os preços com ordenação,"
        - "&7filtro por categoria e pesquisa."
        - ""
        - "&#67E8F9» Clique para abrir"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPreços na descrição: {lore_status}"
      lore:
        - "&7Mostra o preço de venda na"
        - "&7descrição dos itens do seu inventário."
        - "&8Só você vê."
        - ""
        - "&#67E8F9» Clique para alternar"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fVenda automática: {autosell_status}"
      lore:
        - "&7Itens com venda automática ligada"
        - "&7são vendidos assim que você os pega."
        - "&8▸ &7Itens escolhidos: &f{autosell_count}"
        - "&8(Shift+Botão dir. num item de uma categoria)"
        - ""
        - "&#67E8F9» Clique para alternar"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Fechar"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lVender todo o inventário"
      lore:
        - "&7Vende todos os itens adequados."
        - "&8Itens encantados, danificados ou"
        - "&8renomeados nunca são tocados."
        - ""
        - "&#67E8F9Shift+Clique &8» &7vender"
      require-shift: true
      action: SELL_INVENTORY

# ─────────────────── Category menu (menu-mode: CATEGORIES) ───────────────────
# DEFAULT settings for every category menu. A category can override any part of it in
# "category-menus" below or in categories.yml -> menu (title, size, item-slots, layout, item-format).
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {items}; flags: has_prev, has_next
