      - "&7перли та рідкісний лут."
  food:
    name: "&#FBBF24&lЇжа"
    description:
      - "&7М'ясо, хліб, пироги"
      - "&7та золоті яблука."
  ocean:
    name: "&#2DD4BF&lОкеан і риболовля"
    description:
      - "&7Риба, ламінарія, призмарин"
      - "&7та скарби моря."
  nether:
    name: "&#FB7185&lНезер"
    description:
      - "&7Незерак, незерський наріст,"
      - "&7світлокамінь і чорнокамінь."
  end:
    name: "&#C084FC&lКрай"
    description:
      - "&7Ендерняк, корус,"
      - "&7пурпур та елітри."
  plants:
    name: "&#A3E635&lРослини та квіти"
    description:
      - "&7Квіти, барвники, листя"
