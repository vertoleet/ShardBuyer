# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Скупник"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Баланс: &#4ADE80${balance}"
        - "&8▸ &7Усього зароблено: &#4ADE80${earned}"
        - "&8▸ &7Продано предметів: &f{sold}"
        - ""
        - "[leveling]&8▸ &7Рівень: &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Бонус до цін: &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7До рівня {next_level}: &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Наступний бонус: &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ Максимальний рівень!"
        - "[!leveling]&8▸ &7Прокачка: &f{level_mode}"
        - "[perm_boost]&8▸ &7Бонус привілею: &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Бустер сервера: &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lБУСТЕР {booster}"
      lore:
        - "&7Усі ціни скупника помножено!"
        - "&8▸ &7Залишилось: &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lМеню продажу"
      lore:
        - "&7Покладіть будь-які предмети й закрийте"
        - "&7меню — усе продасться автоматично."
        - "&7Зачаровані речі, книги й шалкери теж!"
        - ""
        - "&#67E8F9» Натисніть, щоб відкрити"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lЕксклюзивні предмети"
      lore:
        - "&7Особливі предмети за підвищеною ціною."
        - "&7Здати можна обмежену кількість!"
        - ""
        - "&8▸ &7Оновлення через: &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Натисніть, щоб відкрити"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lСписок цін"
      lore:
        - "&7Усі ціни з сортуванням,"
        - "&7фільтром за категоріями та пошуком."
        - ""
        - "&#67E8F9» Натисніть, щоб відкрити"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fЦіна в описі: {lore_status}"
      lore:
        - "&7Показувати ціну скупника в"
        - "&7описі предметів в інвентарі."
        - "&8Її бачите лише ви."
        - ""
        - "&#67E8F9» Натисніть, щоб перемкнути"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fАвтопродаж: {autosell_status}"
      lore:
        - "&7Предмети з увімкненим автопродажем"
        - "&7продаються одразу при підборі."
        - "&8▸ &7Обрано предметів: &f{autosell_count}"
        - "&8(Shift+ПКМ по предмету в категорії)"
        - ""
        - "&#67E8F9» Натисніть, щоб перемкнути"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Закрити"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lПродати весь інвентар"
      lore:
        - "&7Продасть усі відповідні предмети."
        - "&8Зачаровані, пошкоджені та"
        - "&8перейменовані речі не чіпаються."
        - ""
        - "&#67E8F9Shift+клік &8» &7продати"
      require-shift: true
      action: SELL_INVENTORY

# ─────────────────── Category menu (menu-mode: CATEGORIES) ───────────────────
