      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lСписок цін"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCЕксклюзив &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lПродати всю категорію"
      lore:
        - "&#67E8F9Shift+клік &8» &7продати"
      require-shift: true
      action: SELL_CATEGORY
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Наступна сторінка »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Покладіть предмети для продажу"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lПРОДАТИ ЗА ${total}"
    lore:
      - "&8▸ &7Предметів: &f{amount} &8({positions} видів)"
      - "[has_points]&8▸ &7Очок прокачки: &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171Не продається: {unsellable} шт. &8(повернуться)"
      - ""
      - "&7Або просто закрийте меню."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Покладіть предмети"
      lore:
        - "&8Перетягніть сюди предмети з інвентаря"
        - "&8і закрийте меню або натисніть кнопку."
        - "[has_unsellable]&#F87171Ці предмети не продаються: {unsellable} шт."

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Ціни скупника &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&fспочатку дорогі"
    PRICE_ASC: "&fспочатку дешеві"
    NAME: "&fза назвою"
    CATEGORY: "&fза категоріями"
  filter-all-name: "&fусі категорії"
  search-none: "&8немає"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Ціна: &#4ADE80$&f{price}"
      - "&8▸ &7Стак &8(×{stack})&7: &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Ринок: &#F87171-{market_drop}%"
      - "&8▸ &7Категорія: &f{category_name}"
      - "[auto]&8Ціну розраховано за рецептом крафту"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Ціна книги за рівнями:"
      - "{levels}"
      - ""
      - "&8Зачарування на броні та інструментах"
      - "&8також підвищують їхню ціну."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Попередня сторінка"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Сторінка &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Знайдено: &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fСортування: {sort}"
      lore:
        - "&#67E8F9ЛКМ &8» &7наступна"
        - "&#67E8F9ПКМ &8» &7попередня"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fКатегорія: {filter}"
      lore:
        - "&#67E8F9ЛКМ &8» &7наступна"
        - "&#67E8F9ПКМ &8» &7попередня"
      action: FILTER
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171« Назад"
      action: BACK
    search:
      slot: 50
      material: OAK_SIGN
      name: "&fПошук: &f{search}"
      lore:
        - "&7Натисніть і напишіть назву в чат"
        - "&8(англійська назва або id предмета)"
      action: SEARCH
    clear:
      slot: 51
      condition: searching
      material: RED_DYE
      name: "&#F87171Скинути пошук"
      action: CLEAR_SEARCH
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Наступна сторінка »"
      action: NEXT_PAGE

# ─────────────────── Exclusive items ───────────────────
# The menu refreshes every second (timer). Do NOT put {time_left} into the title!
# Extra placeholders: {time_left} {count} {limit_mode}
# item-format: {item} {price} {base_price} {left} {limit} {sold} {price_left} {points_per_item}
#   flags: available, give_points
exclusive-menu:
  title: "&#7E22CE&lЕксклюзивні предмети"
  size: 36
  item-slots: "11-15,20-24"
  item-format:
    glow: true
    lore:
      - "&8▸ &7Ціна: &#4ADE80$&f{price}"
      - "&8▸ &7Можна здати: &f{left}&7/&f{limit} &8({limit_mode})"
