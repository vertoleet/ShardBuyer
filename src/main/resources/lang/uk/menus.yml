      - "[available]&8▸ &7Можна заробити ще: &#4ADE80$&f{price_left}"
      - "[!available]&#F87171✖ Ліміт вичерпано"
      - ""
      - "&8▸ &7Оновлення через: &#C084FC{time_left}"
      - ""
      - "&#67E8F9ЛКМ &8» &7продати скільки можна"
      - "&#67E8F9ПКМ &8» &7продати стак"
      - "&#67E8F9Shift+клік &8» &7продати 1 шт."
  layout:
    border:
      material: MAGENTA_STAINED_GLASS_PANE
      name: " "
      slots: "0-10,16-19,25-35"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,27,35"
    info:
      slot: 4
      material: CLOCK
      name: "&#E879F9&lЕксклюзив"
      lore:
        - "&7Предмети та ліміти оновляться через:"
        - "&#C084FC{time_left}"
        - ""
        - "&8▸ &7Ліміт: &f{limit_mode}"
    back:
      slot: 31
      material: ARROW
      name: "&#F87171« Назад"
      action: BACK
