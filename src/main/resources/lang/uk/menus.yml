      lore:
        - "{category_description}"
        - ""
        - "&8▸ &7Предметів: &f{items}"
        - "[leveling]&8▸ &7Рівень: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Очки: &f{points}&7/&f{next_points}"
        - "[!leveling]&8▸ &7У цій категорії немає прокачки"
        - "[boosted]&8▸ &7Загальний бонус до цін: &#4ADE80+{boost}%"
        - "[booster]&8▸ &#FBBF24Бустер сервера: &f{booster}"
    back:
      slot: 45
      material: ARROW
      name: "&#F87171« Назад"
      action: BACK
    sell-menu:
      slot: 46
      material: CHEST
      name: "&#4ADE80Меню продажу"
      action: OPEN_SELL
    prev:
      slot: 48
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Попередня сторінка"
      action: PREV_PAGE
    page:
      slot: 49
      material: PAPER
      name: "&7Сторінка &f{page}&7/&f{pages}"
    next:
      slot: 50
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Наступна сторінка »"
      action: NEXT_PAGE
    autosell-toggle:
      slot: 52
      condition: autosell_available
      material: HOPPER
      name: "&fАвтопродаж: {autosell_status}"
      lore:
        - "&7Shift+ПКМ по предмету вмикає"
        - "&7автопродаж цього предмета."
        - ""
        - "&#67E8F9» Натисніть — загальний вимикач"
      action: TOGGLE_AUTOSELL
    sell-category:
      slot: 53
      material: GOLD_BLOCK
      name: "&#FBBF24&lПродати всю категорію"
      lore:
        - "&7Продасть з інвентаря всі"
        - "&7предмети цієї категорії."
        - ""
        - "&#67E8F9Shift+клік &8» &7продати"
      require-shift: true
      action: SELL_CATEGORY

