      - "&7Зачарования повышают цену!"
      - "&8Зачарованное продавайте через /{cmd_sell}."
  enchanting:
    name: "&#F0ABFC&lЗачарования"
    description:
      - "&7Цена книги зависит от"
      - "&7зачарований и их уровня."
  misc:
    name: "&#E7E5E4&lРазное"
    description:
      - "&7Всё остальное, что"
      - "&7можно продать."

# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Скупщик"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Баланс: &#4ADE80${balance}"
        - "&8▸ &7Всего заработано: &#4ADE80${earned}"
        - "&8▸ &7Продано предметов: &f{sold}"
        - ""
        - "[leveling]&8▸ &7Уровень: &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Бонус к ценам: &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7До уровня {next_level}: &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Следующий бонус: &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ Максимальный уровень!"
        - "[!leveling]&8▸ &7Прокачка: &f{level_mode}"
        - "[perm_boost]&8▸ &7Бонус привилегии: &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Бустер сервера: &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lБУСТЕР {booster}"
      lore:
        - "&7Все цены скупщика умножены!"
        - "&8▸ &7Осталось: &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lМеню продажи"
      lore:
        - "&7Положите любые предметы и закройте"
        - "&7меню — всё продастся автоматически."
        - "&7Зачарованные вещи, книги и шалкеры тоже!"
        - ""
        - "&#67E8F9» Нажмите, чтобы открыть"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lЭксклюзивные предметы"
      lore:
        - "&7Особые предметы по повышенной цене."
        - "&7Сдать можно ограниченное количество!"
        - ""
        - "&8▸ &7Обновление через: &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Нажмите, чтобы открыть"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lСписок цен"
      lore:
        - "&7Все цены с сортировкой,"
        - "&7фильтром по категориям и поиском."
        - ""
        - "&#67E8F9» Нажмите, чтобы открыть"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fЦена в описании: {lore_status}"
      lore:
        - "&7Показывать цену скупщика в"
        - "&7описании предметов в инвентаре."
        - "&8Видна только вам."
        - ""
        - "&#67E8F9» Нажмите, чтобы переключить"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fАвтопродажа: {autosell_status}"
      lore:
        - "&7Предметы с включённой автопродажей"
        - "&7продаются сразу при подборе."
        - "&8▸ &7Выбрано предметов: &f{autosell_count}"
        - "&8(Shift+ПКМ по предмету в категории)"
        - ""
        - "&#67E8F9» Нажмите, чтобы переключить"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Закрыть"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lПродать весь инвентарь"
      lore:
        - "&7Продаст все подходящие предметы."
        - "&8Зачарованные, повреждённые и"
        - "&8переименованные вещи не трогаются."
        - ""
        - "&#67E8F9Shift+клик &8» &7продать"
      require-shift: true
      action: SELL_INVENTORY

# ─────────────────── Category menu (menu-mode: CATEGORIES) ───────────────────
# DEFAULT settings for every category menu. A category can override any part of it in
# "category-menus" below or in categories.yml -> menu (title, size, item-slots, layout, item-format).
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {items}; flags: has_prev, has_next
category-menu:
  title: "&8{category_plain} &8({page}/{pages})"
  size: 54
  item-slots: "10-16,19-25,28-34,37-43"
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8"
    info:
      slot: 4
      material: KNOWLEDGE_BOOK
      name: "{category_name}"
      lore:
        - "{category_description}"
        - ""
        - "&8▸ &7Предметов: &f{items}"
        - "[leveling]&8▸ &7Уровень: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Очки: &f{points}&7/&f{next_points}"
        - "[!leveling]&8▸ &7В этой категории нет прокачки"
        - "[boosted]&8▸ &7Итоговый бонус к ценам: &#4ADE80+{boost}%"
        - "[booster]&8▸ &#FBBF24Бустер сервера: &f{booster}"
    back:
      slot: 45
      material: ARROW
      name: "&#F87171« Назад"
      action: BACK
    sell-menu:
      slot: 46
      material: CHEST
      name: "&#4ADE80Меню продажи"
      action: OPEN_SELL
    prev:
      slot: 48
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Предыдущая страница"
      action: PREV_PAGE
    page:
      slot: 49
      material: PAPER
      name: "&7Страница &f{page}&7/&f{pages}"
    next:
      slot: 50
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Следующая страница »"
      action: NEXT_PAGE
    autosell-toggle:
      slot: 52
      condition: autosell_available
      material: HOPPER
      name: "&fАвтопродажа: {autosell_status}"
      lore:
        - "&7Shift+ПКМ по предмету включает"
        - "&7автопродажу этого предмета."
