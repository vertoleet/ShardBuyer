      - "&7жемчуг и редкий лут."
  food:
    name: "&#FBBF24&lЕда"
    description:
      - "&7Мясо, хлеб, пироги"
      - "&7и золотые яблоки."
  ocean:
    name: "&#2DD4BF&lОкеан и рыбалка"
    description:
      - "&7Рыба, ламинария, призмарин"
      - "&7и сокровища моря."
  nether:
    name: "&#FB7185&lНезер"
    description:
      - "&7Незерак, незерский нарост,"
      - "&7светокамень и чернокамень."
  end:
    name: "&#C084FC&lКрай"
    description:
      - "&7Эндерняк, корус,"
      - "&7пурпур и элитры."
  plants:
    name: "&#A3E635&lРастения и цветы"
    description:
      - "&7Цветы, красители, листва"
      - "&7и прочая зелень."
  redstone:
    name: "&#EF4444&lМеханизмы"
    description:
      - "&7Поршни, воронки, рельсы"
      - "&7и другие механизмы."
  equipment:
    name: "&#818CF8&lИнструменты и броня"
