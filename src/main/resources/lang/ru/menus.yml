    name: "&#F59E0B&lДерево"
    description:
      - "&7Брёвна, доски, саженцы"
      - "&7и листва."
  blocks:
    name: "&#D4D4D8&lБлоки и камень"
    description:
      - "&7Камень, земля, песок, стекло"
      - "&7и строительные блоки."
  ores:
    name: "&#38BDF8&lРуды и минералы"
