# ─────────────────── Paged menu (menu-mode: PAGED) ───────────────────
# One menu, pages go through the categories. A big category takes several pages.
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {category_page}
#   {category_pages} {prev_category} {next_category}; flags: has_prev, has_next
paged-menu:
  title: "&8{category_plain} &8[{page}/{pages}]"
  size: 54
  item-slots: "9-44"
  # Category tabs on top (they scroll if there are more categories than slots)
  category-tabs:
    enabled: true
    slots: "0-8"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Предыдущая страница"
      lore:
        - "&8» &7{prev_category}"
      action: PREV_PAGE
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fЦена в описании: {lore_status}"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fАвтопродажа: {autosell_status}"
      lore:
        - "&8▸ &7Выбрано предметов: &f{autosell_count}"
      action: TOGGLE_AUTOSELL
    sell-menu:
      slot: 48
      material: CHEST
      name: "&#4ADE80Меню продажи"
      action: OPEN_SELL
    info:
      slot: 49
      material: AMETHYST_SHARD
      glow: true
      name: "{category_name}"
      lore:
        - "&8▸ &7Страница категории: &f{category_page}/{category_pages}"
        - "&8▸ &7Баланс: &#4ADE80${balance}"
        - ""
        - "[leveling]&8▸ &7Уровень: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[!leveling]&8▸ &7Здесь нет прокачки"
        - "[booster]&8▸ &#FBBF24Бустер: &f{booster} &7({booster_time})"
    worth:
      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lСписок цен"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCЭксклюзив &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lПродать всю категорию"
      lore:
        - "&#67E8F9Shift+клик &8» &7продать"
      require-shift: true
      action: SELL_CATEGORY
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Следующая страница »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Положите предметы для продажи"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lПРОДАТЬ ЗА ${total}"
    lore:
      - "&8▸ &7Предметов: &f{amount} &8({positions} видов)"
      - "[has_points]&8▸ &7Очков прокачки: &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171Не продаётся: {unsellable} шт. &8(вернутся)"
      - ""
      - "&7Или просто закройте меню."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Положите предметы"
      lore:
        - "&8Перетащите сюда предметы из инвентаря"
        - "&8и закройте меню или нажмите кнопку."
        - "[has_unsellable]&#F87171Эти предметы не продаются: {unsellable} шт."

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Цены скупщика &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&fсначала дорогие"
    PRICE_ASC: "&fсначала дешёвые"
    NAME: "&fпо названию"
    CATEGORY: "&fпо категориям"
  filter-all-name: "&fвсе категории"
  search-none: "&8нет"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Цена: &#4ADE80$&f{price}"
      - "&8▸ &7Стак &8(×{stack})&7: &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Рынок: &#F87171-{market_drop}%"
      - "&8▸ &7Категория: &f{category_name}"
      - "[auto]&8Цена рассчитана по рецепту крафта"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Цена книги по уровням:"
      - "{levels}"
      - ""
      - "&8Зачарования на броне и инструментах"
      - "&8тоже повышают их цену."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Предыдущая страница"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Страница &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Найдено: &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fСортировка: {sort}"
      lore:
        - "&#67E8F9ЛКМ &8» &7следующая"
        - "&#67E8F9ПКМ &8» &7предыдущая"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fКатегория: {filter}"
      lore:
        - "&#67E8F9ЛКМ &8» &7следующая"
        - "&#67E8F9ПКМ &8» &7предыдущая"
      action: FILTER
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171« Назад"
      action: BACK
    search:
      slot: 50
      material: OAK_SIGN
      name: "&fПоиск: &f{search}"
      lore:
        - "&7Нажмите и напишите название в чат"
        - "&8(английское название или id предмета)"
      action: SEARCH
    clear:
      slot: 51
      condition: searching
      material: RED_DYE
      name: "&#F87171Сбросить поиск"
      action: CLEAR_SEARCH
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Следующая страница »"
      action: NEXT_PAGE

# ─────────────────── Exclusive items ───────────────────
# The menu refreshes every second (timer). Do NOT put {time_left} into the title!
# Extra placeholders: {time_left} {count} {limit_mode}
# item-format: {item} {price} {base_price} {left} {limit} {sold} {price_left} {points_per_item}
#   flags: available, give_points
exclusive-menu:
  title: "&#7E22CE&lЭксклюзивные предметы"
  size: 36
  item-slots: "11-15,20-24"
  item-format:
