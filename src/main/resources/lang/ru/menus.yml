        - "&#67E8F9» Нажмите — общий выключатель"
      action: TOGGLE_AUTOSELL
    sell-category:
      slot: 53
      material: GOLD_BLOCK
      name: "&#FBBF24&lПродать всю категорию"
      lore:
        - "&7Продаст из инвентаря все"
        - "&7предметы этой категории."
        - ""
        - "&#67E8F9Shift+клик &8» &7продать"
      require-shift: true
      action: SELL_CATEGORY

# Per-category menu overrides (keys you set here replace the ones from category-menu).
