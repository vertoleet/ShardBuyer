# ╔════════════════════════════════════════════════════════════════════════╗
# ║                ShardBuyer — menus / GUI (Русский)
# ╚════════════════════════════════════════════════════════════════════════╝
# Menu item:
#   material, amount, name, lore, glow, custom-model-data, hide-flags
#   slot: 5 | slots: "0-8,45-53" | slots: [0, 1, "10-16"]
#   action: what happens on click (several actions separated by ";")
#   require-shift: true  — only works with Shift+click (protection from misclicks)
#   condition: flag      — show only if the flag is true ("!flag" — only if false)
#   alt: {...}           — what to show instead when the condition is false
# If "name" is not set, the item keeps its vanilla name in the player's client language.
# Lore lines can start with conditions: "[leveling]...", "[!maxed]...", "[market]..."
# Colors: &a  HEX: &#C084FC  (gradients are supported too: <gradient:#C084FC:#67E8F9>text</gradient>)
#
# Actions: CLOSE, BACK, OPEN_MAIN, OPEN_SELL, OPEN_WORTH, OPEN_EXCLUSIVE, OPEN_CATEGORY:<id>,
#   TOGGLE_LORE, TOGGLE_AUTOSELL, SELL_INVENTORY, REFRESH, COMMAND:<cmd>, CONSOLE:<cmd>, MESSAGE:<text>
#   category menus: NEXT_PAGE, PREV_PAGE, SELL_CATEGORY   paged menu: + NEXT_CATEGORY, PREV_CATEGORY
#   /worth: NEXT_PAGE, PREV_PAGE, SORT, FILTER, SEARCH, CLEAR_SEARCH, CLEAR_FILTER
#
# Player placeholders (all menus):
#   {player} {balance} {level} {max_level} {next_level} {points} {next_points} {points_left} {progress}
#   {progress_bar} {bonus} {next_bonus} {boost} {perm_boost} {booster} {booster_time} {lore_status}
#   {autosell_status} {autosell_count} {exclusive_time} {earned} {sold} {level_mode} {market_recovery}
# Flags: leveling, maxed, boosted, perm_boost, booster, lore_available, lore_on, autosell_available,
#   autosell_on, exclusive_available, market

# ─────────────────── Item icon format (shared) ───────────────────
# {item} {price} {price_stack} {stack} {base_price} {amount} {price_inventory} {market_percent}
# {market_drop} {points_per_item} {autosell_item_status}
# Flags: has_items, market, leveling, autosell_available, autosell_item
item-format:
  lore:
    - "&8▸ &7Цена: &#4ADE80$&f{price}"
    - "&8▸ &7Стак &8(×{stack})&7: &#4ADE80$&f{price_stack}"
    - "[market]&8▸ &7Рынок: &#F87171-{market_drop}% &8(сдают слишком много)"
    - "[leveling]&8▸ &7Очков за шт.: &#C084FC{points_per_item}"
    - ""
    - "[has_items]&8▸ &7У вас: &f{amount} &8→ &#4ADE80$&f{price_inventory}"
    - "[!has_items]&8▸ &7У вас нет этого предмета"
    - ""
    - "&#67E8F9ЛКМ &8» &7продать все"
    - "&#67E8F9ПКМ &8» &7продать стак"
    - "&#67E8F9Shift+ЛКМ &8/ &#67E8F9Q &8» &7продать 1 шт."
    - "[autosell_available]&#67E8F9Shift+ПКМ &8» &7автопродажа: {autosell_item_status}"

# ─────────────────── Category icons ───────────────────
# Used for every category (main menu and tabs) unless categories.yml sets its own icon name/lore.
# {category_name} {category_description} {items} + player placeholders; flag "selected" = current tab
category-icon:
  name: "{category_name}"
  lore:
    - "{category_description}"
    - ""
    - "&8▸ &7Предметов: &f{items}"
    - "[leveling]&8▸ &7Уровень: &#67E8F9{level} &8| &#4ADE80+{bonus}%"
    - "[leveling][!maxed]&8▸ {progress_bar}"
    - "[!leveling]&8▸ &7Без прокачки"
    - ""
    - "[selected]&#4ADE80▶ Вы здесь"
    - "[!selected]&#67E8F9» Нажмите, чтобы открыть"

