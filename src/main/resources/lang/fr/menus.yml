# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Acheteur"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Solde : &#4ADE80${balance}"
        - "&8▸ &7Total gagné : &#4ADE80${earned}"
        - "&8▸ &7Objets vendus : &f{sold}"
        - ""
        - "[leveling]&8▸ &7Niveau : &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Bonus de prix : &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7Jusqu'au niveau {next_level} : &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Bonus suivant : &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ Niveau maximum atteint !"
        - "[!leveling]&8▸ &7Niveaux : &f{level_mode}"
        - "[perm_boost]&8▸ &7Bonus de grade : &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Boost du serveur : &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lBOOST {booster}"
      lore:
        - "&7Tous les prix sont multipliés !"
        - "&8▸ &7Temps restant : &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lMenu de vente"
      lore:
        - "&7Déposez n'importe quels objets et fermez"
        - "&7le menu — tout sera vendu automatiquement."
        - "&7Équipement enchanté, livres et shulkers aussi !"
        - ""
        - "&#67E8F9» Cliquez pour ouvrir"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lObjets exclusifs"
      lore:
        - "&7Des objets spéciaux à prix boostés."
        - "&7Vous ne pouvez en vendre qu'une quantité limitée !"
        - ""
        - "&8▸ &7Renouvellement dans : &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Cliquez pour ouvrir"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lListe des prix"
      lore:
        - "&7Tous les prix avec tri,"
        - "&7filtre par catégorie et recherche."
        - ""
        - "&#67E8F9» Cliquez pour ouvrir"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPrix dans les descriptions : {lore_status}"
      lore:
        - "&7Affiche le prix de vente dans la"
        - "&7description des objets de votre inventaire."
        - "&8Vous seul le voyez."
        - ""
        - "&#67E8F9» Cliquez pour basculer"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fVente auto : {autosell_status}"
      lore:
        - "&7Les objets avec la vente auto activée"
        - "&7sont vendus dès que vous les ramassez."
        - "&8▸ &7Objets choisis : &f{autosell_count}"
        - "&8(Maj+Clic droit sur un objet d'une catégorie)"
        - ""
        - "&#67E8F9» Cliquez pour basculer"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Fermer"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lVendre tout l'inventaire"
      lore:
        - "&7Vend tous les objets adaptés."
        - "&8Les objets enchantés, abîmés ou"
        - "&8renommés ne sont jamais touchés."
        - ""
        - "&#67E8F9Maj+Clic &8» &7vendre"
      require-shift: true
      action: SELL_INVENTORY

