# ─────────────────── Paged menu (menu-mode: PAGED) ───────────────────
# One menu, pages go through the categories. A big category takes several pages.
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {category_page}
#   {category_pages} {prev_category} {next_category}; flags: has_prev, has_next
paged-menu:
  title: "&8{category_plain} &8[{page}/{pages}]"
  size: 54
  item-slots: "9-44"
  # Category tabs on top (they scroll if there are more categories than slots)
  category-tabs:
    enabled: true
    slots: "0-8"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Page précédente"
      lore:
        - "&8» &7{prev_category}"
      action: PREV_PAGE
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPrix dans les descriptions : {lore_status}"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fVente auto : {autosell_status}"
      lore:
        - "&8▸ &7Objets choisis : &f{autosell_count}"
      action: TOGGLE_AUTOSELL
    sell-menu:
      slot: 48
      material: CHEST
      name: "&#4ADE80Menu de vente"
      action: OPEN_SELL
    info:
      slot: 49
      material: AMETHYST_SHARD
      glow: true
      name: "{category_name}"
      lore:
        - "&8▸ &7Page de la catégorie : &f{category_page}/{category_pages}"
        - "&8▸ &7Solde : &#4ADE80${balance}"
        - ""
        - "[leveling]&8▸ &7Niveau : &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[!leveling]&8▸ &7Pas de niveaux ici"
        - "[booster]&8▸ &#FBBF24Boost : &f{booster} &7({booster_time})"
    worth:
      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lListe des prix"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCExclusifs &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lVendre toute la catégorie"
      lore:
        - "&#67E8F9Maj+Clic &8» &7vendre"
      require-shift: true
      action: SELL_CATEGORY
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Page suivante »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Déposez les objets à vendre"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lVENDRE POUR ${total}"
    lore:
      - "&8▸ &7Objets : &f{amount} &8({positions} types)"
      - "[has_points]&8▸ &7Points de niveau : &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171Invendables : {unsellable} &8(seront rendus)"
      - ""
      - "&7Ou fermez simplement le menu."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Déposez des objets"
      lore:
        - "&8Glissez ici des objets de votre inventaire"
        - "&8puis fermez le menu ou cliquez sur ce bouton."
        - "[has_unsellable]&#F87171Ces objets ne peuvent pas être vendus : {unsellable}"

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Liste des prix &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&fles plus chers d'abord"
    PRICE_ASC: "&fles moins chers d'abord"
    NAME: "&fpar nom"
    CATEGORY: "&fpar catégorie"
  filter-all-name: "&ftoutes les catégories"
  search-none: "&8aucune"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Prix : &#4ADE80$&f{price}"
      - "&8▸ &7Pile &8(×{stack})&7 : &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Marché : &#F87171-{market_drop}%"
      - "&8▸ &7Catégorie : &f{category_name}"
      - "[auto]&8Prix calculé à partir de la recette"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Prix du livre par niveau :"
      - "{levels}"
      - ""
      - "&8Les enchantements sur les armures et"
      - "&8outils augmentent aussi leur prix."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Page précédente"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Page &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Trouvés : &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fTri : {sort}"
      lore:
        - "&#67E8F9Clic gauche &8» &7suivant"
        - "&#67E8F9Clic droit &8» &7précédent"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fCatégorie : {filter}"
