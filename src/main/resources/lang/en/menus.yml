# ─────────────────── Paged menu (menu-mode: PAGED) ───────────────────
# One menu, pages go through the categories. A big category takes several pages.
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {category_page}
#   {category_pages} {prev_category} {next_category}; flags: has_prev, has_next
paged-menu:
  title: "&8{category_plain} &8[{page}/{pages}]"
  size: 54
  item-slots: "9-44"
  # Category tabs on top (they scroll if there are more categories than slots)
  category-tabs:
    enabled: true
    slots: "0-8"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Previous page"
      lore:
        - "&8» &7{prev_category}"
      action: PREV_PAGE
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPrices in descriptions: {lore_status}"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fAuto-sell: {autosell_status}"
      lore:
        - "&8▸ &7Selected items: &f{autosell_count}"
      action: TOGGLE_AUTOSELL
    sell-menu:
      slot: 48
      material: CHEST
      name: "&#4ADE80Sell Menu"
      action: OPEN_SELL
    info:
      slot: 49
      material: AMETHYST_SHARD
      glow: true
      name: "{category_name}"
      lore:
        - "&8▸ &7Category page: &f{category_page}/{category_pages}"
        - "&8▸ &7Balance: &#4ADE80${balance}"
        - ""
        - "[leveling]&8▸ &7Level: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[!leveling]&8▸ &7No leveling here"
        - "[booster]&8▸ &#FBBF24Booster: &f{booster} &7({booster_time})"
    worth:
      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lPrice List"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCExclusive &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lSell Whole Category"
      lore:
        - "&#67E8F9Shift+Click &8» &7sell"
      require-shift: true
      action: SELL_CATEGORY
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Next page »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Put items here to sell"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lSELL FOR ${total}"
    lore:
      - "&8▸ &7Items: &f{amount} &8({positions} kinds)"
      - "[has_points]&8▸ &7Leveling points: &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171Not sellable: {unsellable} &8(will be returned)"
      - ""
      - "&7Or simply close the menu."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Put items in"
      lore:
        - "&8Drag items here from your inventory"
        - "&8and close the menu or press this button."
        - "[has_unsellable]&#F87171These items can't be sold: {unsellable}"

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Price list &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&fmost expensive first"
    PRICE_ASC: "&fcheapest first"
    NAME: "&fby name"
    CATEGORY: "&fby category"
  filter-all-name: "&fall categories"
  search-none: "&8none"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Price: &#4ADE80$&f{price}"
      - "&8▸ &7Stack &8(×{stack})&7: &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Market: &#F87171-{market_drop}%"
      - "&8▸ &7Category: &f{category_name}"
      - "[auto]&8Price calculated from the crafting recipe"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Book price by level:"
      - "{levels}"
      - ""
      - "&8Enchantments on armor and tools"
      - "&8also raise their price."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Previous page"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Page &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Found: &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fSort: {sort}"
      lore:
        - "&#67E8F9LMB &8» &7next"
        - "&#67E8F9RMB &8» &7previous"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fCategory: {filter}"
      lore:
        - "&#67E8F9LMB &8» &7next"
        - "&#67E8F9RMB &8» &7previous"
      action: FILTER
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171« Back"
      action: BACK
    search:
      slot: 50
      material: OAK_SIGN
      name: "&fSearch: &f{search}"
      lore:
        - "&7Click and type a name in chat"
        - "&8(English item names or ids)"
      action: SEARCH
    clear:
      slot: 51
      condition: searching
      material: RED_DYE
      name: "&#F87171Clear search"
      action: CLEAR_SEARCH
    next:
      slot: 53
      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Next page »"
      action: NEXT_PAGE

# ─────────────────── Exclusive items ───────────────────
# The menu refreshes every second (timer). Do NOT put {time_left} into the title!
# Extra placeholders: {time_left} {count} {limit_mode}
# item-format: {item} {price} {base_price} {left} {limit} {sold} {price_left} {points_per_item}
#   flags: available, give_points
exclusive-menu:
  title: "&#7E22CE&lExclusive Items"
  size: 36
  item-slots: "11-15,20-24"
  item-format:
    glow: true
    lore:
