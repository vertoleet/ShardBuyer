      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Next page »"
      action: NEXT_PAGE
    autosell-toggle:
      slot: 52
      condition: autosell_available
      material: HOPPER
      name: "&fAuto-sell: {autosell_status}"
      lore:
        - "&7Shift+RMB on an item enables"
        - "&7auto-sell for that item."
        - ""
        - "&#67E8F9» Click — master switch"
      action: TOGGLE_AUTOSELL
    sell-category:
      slot: 53
      material: GOLD_BLOCK
      name: "&#FBBF24&lSell Whole Category"
      lore:
        - "&7Sells every item of this"
        - "&7category from your inventory."
        - ""
        - "&#67E8F9Shift+Click &8» &7sell"
      require-shift: true
      action: SELL_CATEGORY

