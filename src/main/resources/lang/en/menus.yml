# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Buyer"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Balance: &#4ADE80${balance}"
        - "&8▸ &7Total earned: &#4ADE80${earned}"
        - "&8▸ &7Items sold: &f{sold}"
        - ""
        - "[leveling]&8▸ &7Level: &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Price bonus: &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7To level {next_level}: &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Next bonus: &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ Max level reached!"
        - "[!leveling]&8▸ &7Leveling: &f{level_mode}"
        - "[perm_boost]&8▸ &7Rank bonus: &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Server booster: &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lBOOSTER {booster}"
      lore:
        - "&7All buyer prices are multiplied!"
        - "&8▸ &7Time left: &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lSell Menu"
      lore:
        - "&7Put any items in and close the menu —"
        - "&7everything will be sold automatically."
        - "&7Enchanted gear, books and shulkers too!"
        - ""
        - "&#67E8F9» Click to open"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lExclusive Items"
      lore:
        - "&7Special items with boosted prices."
        - "&7You can only sell a limited amount!"
        - ""
        - "&8▸ &7Refreshes in: &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Click to open"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lPrice List"
      lore:
        - "&7All prices with sorting,"
        - "&7category filters and search."
        - ""
        - "&#67E8F9» Click to open"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPrices in descriptions: {lore_status}"
      lore:
        - "&7Show the buyer price in the"
        - "&7description of items in your inventory."
        - "&8Only you can see it."
        - ""
        - "&#67E8F9» Click to toggle"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fAuto-sell: {autosell_status}"
      lore:
        - "&7Items with auto-sell enabled are"
        - "&7sold the moment you pick them up."
        - "&8▸ &7Selected items: &f{autosell_count}"
        - "&8(Shift+RMB on an item in a category)"
        - ""
        - "&#67E8F9» Click to toggle"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Close"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lSell Whole Inventory"
      lore:
        - "&7Sells every suitable item."
        - "&8Enchanted, damaged and renamed"
        - "&8items are never touched."
        - ""
        - "&#67E8F9Shift+Click &8» &7sell"
      require-shift: true
      action: SELL_INVENTORY

# ─────────────────── Category menu (menu-mode: CATEGORIES) ───────────────────
# DEFAULT settings for every category menu. A category can override any part of it in
# "category-menus" below or in categories.yml -> menu (title, size, item-slots, layout, item-format).
# Extra placeholders: {category_name} {category_plain} (name without colors, for titles) {category_description} {page} {pages} {items}; flags: has_prev, has_next
category-menu:
  title: "&8{category_plain} &8({page}/{pages})"
  size: 54
  item-slots: "10-16,19-25,28-34,37-43"
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8"
    info:
      slot: 4
      material: KNOWLEDGE_BOOK
      name: "{category_name}"
      lore:
        - "{category_description}"
        - ""
        - "&8▸ &7Items: &f{items}"
        - "[leveling]&8▸ &7Level: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Points: &f{points}&7/&f{next_points}"
        - "[!leveling]&8▸ &7No leveling in this category"
        - "[boosted]&8▸ &7Total price bonus: &#4ADE80+{boost}%"
        - "[booster]&8▸ &#FBBF24Server booster: &f{booster}"
    back:
      slot: 45
      material: ARROW
      name: "&#F87171« Back"
      action: BACK
    sell-menu:
      slot: 46
      material: CHEST
      name: "&#4ADE80Sell Menu"
      action: OPEN_SELL
    prev:
      slot: 48
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Previous page"
      action: PREV_PAGE
    page:
