# ─────────────────── Main menu (menu-mode: CATEGORIES) ───────────────────
# Category icon slots are set in categories.yml
main-menu:
  title: "&#5B21B6&lShard&#0E7490&lBuyer &8• &8Comprador"
  size: 54
  layout:
    border:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "0-9,17,18,26,27,35,36,44-53"
    corners:
      material: PURPLE_STAINED_GLASS_PANE
      name: " "
      slots: "0,8,45,53"
    accents:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      name: " "
      slots: "3,5,48,50"
    profile:
      slot: 4
      material: AMETHYST_SHARD
      glow: true
      name: "&#C084FC&l{player}"
      lore:
        - "&8▸ &7Saldo: &#4ADE80${balance}"
        - "&8▸ &7Total ganado: &#4ADE80${earned}"
        - "&8▸ &7Objetos vendidos: &f{sold}"
        - ""
        - "[leveling]&8▸ &7Nivel: &#67E8F9{level}&7/&#67E8F9{max_level}"
        - "[leveling]&8▸ &7Bonus de precio: &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ &7Para el nivel {next_level}: &f{points}&7/&f{next_points}"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[leveling][!maxed]&8▸ &7Siguiente bonus: &#4ADE80+{next_bonus}%"
        - "[leveling][maxed]&#FBBF24✦ ¡Nivel máximo alcanzado!"
        - "[!leveling]&8▸ &7Niveles: &f{level_mode}"
        - "[perm_boost]&8▸ &7Bonus de rango: &#4ADE80+{perm_boost}%"
        - "[booster]&8▸ &#FBBF24Potenciador del servidor: &f{booster} &7({booster_time})"
    booster:
      slot: 7
      condition: booster
      material: BLAZE_POWDER
      glow: true
      name: "&#FBBF24&lPOTENCIADOR {booster}"
      lore:
        - "&7¡Todos los precios están multiplicados!"
        - "&8▸ &7Tiempo restante: &#FBBF24{booster_time}"
    sell-menu:
      slot: 38
      material: CHEST
      name: "&#4ADE80&lMenú de venta"
      lore:
        - "&7Pon cualquier objeto y cierra el menú:"
        - "&7todo se venderá automáticamente."
        - "&7¡También equipo encantado, libros y shulkers!"
        - ""
        - "&#67E8F9» Clic para abrir"
      action: OPEN_SELL
    exclusive:
      slot: 40
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#E879F9&lObjetos exclusivos"
      lore:
        - "&7Objetos especiales con precios mejorados."
        - "&7¡Solo puedes vender una cantidad limitada!"
        - ""
        - "&8▸ &7Se renuevan en: &#C084FC{exclusive_time}"
        - ""
        - "&#67E8F9» Clic para abrir"
      action: OPEN_EXCLUSIVE
    worth:
      slot: 42
      material: SPYGLASS
      name: "&#38BDF8&lLista de precios"
      lore:
        - "&7Todos los precios con orden,"
        - "&7filtro por categoría y búsqueda."
        - ""
        - "&#67E8F9» Clic para abrir"
      action: OPEN_WORTH
    lore-toggle:
      slot: 46
      condition: lore_available
      material: NAME_TAG
      name: "&fPrecios en la descripción: {lore_status}"
      lore:
        - "&7Muestra el precio de venta en la"
        - "&7descripción de los objetos de tu inventario."
        - "&8Solo tú puedes verlo."
        - ""
        - "&#67E8F9» Clic para cambiar"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fAutoventa: {autosell_status}"
      lore:
        - "&7Los objetos con autoventa activada"
        - "&7se venden en cuanto los recoges."
        - "&8▸ &7Objetos elegidos: &f{autosell_count}"
        - "&8(Shift+Clic der. sobre un objeto de una categoría)"
        - ""
        - "&#67E8F9» Clic para cambiar"
      action: TOGGLE_AUTOSELL
    close:
      slot: 49
      material: BARRIER
      name: "&#F87171Cerrar"
      action: CLOSE
    sell-inventory:
      slot: 51
      material: GOLD_INGOT
      name: "&#FBBF24&lVender todo el inventario"
      lore:
        - "&7Vende todos los objetos válidos."
        - "&8Los objetos encantados, dañados o"
        - "&8renombrados nunca se tocan."
        - ""
        - "&#67E8F9Shift+Clic &8» &7vender"
      require-shift: true
      action: SELL_INVENTORY

