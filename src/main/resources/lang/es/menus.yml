      condition: has_next
      material: SPECTRAL_ARROW
      name: "&#67E8F9Página siguiente »"
      lore:
        - "&8» &7{next_category}"
      action: NEXT_PAGE

# ─────────────────── Sell menu ───────────────────
# Put items in → press the button or simply close the menu → everything is sold.
# Set button.enabled: false to use all 54 slots for items.
sell-menu:
  title: "&8Pon aquí los objetos a vender"
  size: 54
  button:
    enabled: true
    slot: 49
    material: LIME_STAINED_GLASS_PANE
    glow: true
    # {total} {amount} {positions} {points_total} {unsellable}; flags: has_items, has_points, has_unsellable
    name: "&#4ADE80&lVENDER POR ${total}"
    lore:
      - "&8▸ &7Objetos: &f{amount} &8({positions} tipos)"
      - "[has_points]&8▸ &7Puntos de nivel: &#C084FC+{points_total}"
      - "[has_unsellable]&8▸ &#F87171No vendibles: {unsellable} &8(se devolverán)"
      - ""
      - "&7O simplemente cierra el menú."
    # how the button looks when there is nothing to sell
    empty:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7Pon objetos"
      lore:
        - "&8Arrastra aquí objetos de tu inventario"
        - "&8y cierra el menú o pulsa este botón."
        - "[has_unsellable]&#F87171Estos objetos no se pueden vender: {unsellable}"

# ─────────────────── /worth — price list ───────────────────
# Extra placeholders: {page} {pages} {count} {sort} {filter} {search}; flags: has_prev, has_next, searching, filtered
worth-menu:
  title: "&8Lista de precios &8({page}/{pages})"
  size: 54
  item-slots: "0-44"
  # PRICE_DESC / PRICE_ASC / NAME / CATEGORY
  default-sort: PRICE_DESC
  show-enchantments: true
  sort-names:
    PRICE_DESC: "&flos más caros primero"
    PRICE_ASC: "&flos más baratos primero"
    NAME: "&fpor nombre"
    CATEGORY: "&fpor categoría"
  filter-all-name: "&ftodas las categorías"
  search-none: "&8ninguna"
  # {item} {price} {price_stack} {stack} {base_price} {category_name} {market_percent} {market_drop} {points_per_item}
  # flags: market, auto (price calculated from a recipe), leveling
  item-format:
    lore:
      - "&8▸ &7Precio: &#4ADE80$&f{price}"
      - "&8▸ &7Pila &8(×{stack})&7: &#4ADE80$&f{price_stack}"
      - "[market]&8▸ &7Mercado: &#F87171-{market_drop}%"
      - "&8▸ &7Categoría: &f{category_name}"
      - "[auto]&8Precio calculado a partir de la receta"
  # Enchanted books. hide-flags: false — the client shows the enchantment name in the player's language.
  # {max_level} {price} {levels}
  enchant-format:
    hide-flags: false
    lore:
      - ""
      - "&7Precio del libro por nivel:"
      - "{levels}"
      - ""
      - "&8Los encantamientos en armaduras y"
      - "&8herramientas también suben su precio."
    level-line: "&8 ▸ &7{level_roman}&8: &#4ADE80$&f{price}"
  layout:
    bottom:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
      slots: "45-53"
    prev:
      slot: 45
      condition: has_prev
      material: SPECTRAL_ARROW
      name: "&#67E8F9« Página anterior"
      action: PREV_PAGE
    info:
      slot: 46
      material: PAPER
      name: "&7Página &f{page}&7/&f{pages}"
      lore:
        - "&8▸ &7Encontrados: &f{count}"
    sort:
      slot: 47
      material: COMPARATOR
      name: "&fOrden: {sort}"
      lore:
        - "&#67E8F9Clic izq. &8» &7siguiente"
        - "&#67E8F9Clic der. &8» &7anterior"
      action: SORT
    filter:
      slot: 48
      material: HOPPER
      name: "&fCategoría: {filter}"
      lore:
