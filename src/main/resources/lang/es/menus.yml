        - ""
        - "[leveling]&8▸ &7Nivel: &#67E8F9{level}&7/&#67E8F9{max_level} &8| &#4ADE80+{bonus}%"
        - "[leveling][!maxed]&8▸ {progress_bar} &7{progress}%"
        - "[!leveling]&8▸ &7Sin niveles aquí"
        - "[booster]&8▸ &#FBBF24Potenciador: &f{booster} &7({booster_time})"
    worth:
      slot: 50
      material: SPYGLASS
      name: "&#38BDF8&lLista de precios"
      action: OPEN_WORTH
    exclusive:
      slot: 51
      condition: exclusive_available
      material: NETHER_STAR
      glow: true
      name: "&#C084FCExclusivos &7({exclusive_time})"
      action: OPEN_EXCLUSIVE
    sell-category:
      slot: 52
      material: GOLD_BLOCK
      name: "&#FBBF24&lVender toda la categoría"
      lore:
        - "&#67E8F9Shift+Clic &8» &7vender"
      require-shift: true
      action: SELL_CATEGORY
    next:
