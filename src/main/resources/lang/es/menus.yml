      condition: lore_available
      material: NAME_TAG
      name: "&fPrecios en la descripción: {lore_status}"
      action: TOGGLE_LORE
    autosell-toggle:
      slot: 47
      condition: autosell_available
      material: HOPPER
      name: "&fAutoventa: {autosell_status}"
      lore:
        - "&8▸ &7Objetos elegidos: &f{autosell_count}"
      action: TOGGLE_AUTOSELL
    sell-menu:
      slot: 48
      material: CHEST
      name: "&#4ADE80Menú de venta"
      action: OPEN_SELL
    info:
      slot: 49
      material: AMETHYST_SHARD
      glow: true
      name: "{category_name}"
      lore:
        - "&8▸ &7Página de la categoría: &f{category_page}/{category_pages}"
